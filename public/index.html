<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All-in-One Digital Planner 2027</title>
<style>
  :root { --bg:#fbfaf7; --fg:#2f3a34; --main:#5f7f6e; --soft:#e3ebe5; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16201b; --fg:#e8efe9; --main:#8fb3a0; --soft:#22302a; } }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--fg); display:flex; flex-direction:column; height:100vh; }
  header { padding:12px 16px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; background:var(--soft); }
  h1 { font-size:16px; margin:0 12px 0 0; color:var(--main); }
  select, a.btn { font:inherit; padding:7px 12px; border-radius:8px; border:1px solid var(--main); background:var(--bg); color:var(--fg); text-decoration:none; }
  a.btn { background:var(--main); color:var(--bg); border-color:var(--main); }
  main { flex:1; min-height:0; }
  iframe { width:100%; height:100%; border:0; }
  .note { padding:6px 16px; font-size:12px; opacity:.75; }
</style>
</head>
<body>
<header>
  <h1>Planner 2027</h1>
  <label>Mulai
    <select id="start"><option value="monday">Senin</option><option value="sunday">Minggu</option></select>
  </label>
  <label>Tema
    <select id="theme"><option value="sage">Sage</option><option value="rose">Rose</option><option value="slate">Slate</option></select>
  </label>
  <a class="btn" id="open" target="_blank" rel="noopener">Buka di tab baru</a>
  <a class="btn" id="dl" download>Download PDF</a>
</header>
<div class="note">Di HP, jika pratinjau tidak muncul, pakai tombol "Buka di tab baru". Link antar halaman bekerja di PDF viewer, GoodNotes, dan Notability.</div>
<main><iframe id="view" title="Planner preview"></iframe></main>
<script>
  const s = document.getElementById('start'), t = document.getElementById('theme');
  function update() {
    const url = `planners/Planner-2027-${s.value}-${t.value}.pdf`;
    document.getElementById('view').src = url;
    document.getElementById('open').href = url;
    document.getElementById('dl').href = url;
  }
  s.addEventListener('change', update);
  t.addEventListener('change', update);
  update();
</script>
</body>
</html>
