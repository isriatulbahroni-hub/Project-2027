<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planner OS 2027</title>
<meta name="theme-color" content="#1c2438">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="side" aria-label="Navigasi modul"></aside>
  <header id="top">
    <button class="ib" id="menu" aria-label="Buka menu"></button>
    <label class="sr"><span id="sico"></span><input id="q" list="mods" placeholder="Cari modul" aria-label="Cari modul" autocomplete="off"></label>
    <datalist id="mods"></datalist>
    <span class="sp"></span>
    <button class="ib" id="bell" aria-label="Pengingat"><span class="dot"></span></button>
    <button class="ib" id="gear" aria-label="Ganti tema terang atau gelap"></button>
    <span class="av" title="Profil">S</span>
    <div id="pop" hidden></div>
  </header>
  <main id="main"><div class="wrap" id="view"></div></main>
</div>
<script src="core.js"></script>
<script src="mods1.js"></script>
<script src="mods2.js"></script>
</body>
</html>
