name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python check_data.py
      - run: for f in public/*.js; do node --check "$f"; done
      - run: python -c "import json; json.load(open('vercel.json')); json.load(open('public/manifest.webmanifest')); print('JSON valid')"
      - run: python make_icons.py
      - name: Tes web (semua modul, tombol, form)
        run: cd tests && npm install --no-audit --no-fund && node smoke_web.js
      - name: PDF lengkap (501 halaman) - link dan area ketuk
        run: |
          python generate_planner.py --year 2027 --out /tmp/lengkap.pdf
          python tests/check_pdf.py /tmp/lengkap.pdf 501
      - name: PDF ringkas (136 halaman) - link dan area ketuk
        run: |
          python generate_planner.py --year 2027 --no-daily --out /tmp/ringkas.pdf
          python tests/check_pdf.py /tmp/ringkas.pdf 136
